name: Generate Pac-Man Contribution Graph

on:
  schedule:
    - cron: "0 */12 * * *" 
  workflow_dispatch: 
  push:
    branches:
      - main 

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write 

    steps:
      - name: 📡 Checkout da Infraestrutura
        uses: actions/checkout@v3

      - name: 👾 Gerar Animação do Pac-Man
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/pacman-contribution-graph.svg?palette=github-dark&color_snake=#FFFF00&color_dots=#39d353,#26a641,#006d32,#0e4429
            dist/pacman-contribution-graph-dark.svg?palette=github-dark&color_snake=#FFFF00&color_dots=#39d353,#26a641,#006d32,#0e4429
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🚀 Injetar SVG na branch isolada
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output-pacman
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
